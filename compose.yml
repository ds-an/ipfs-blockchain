# TODO: Maybe switch Kubo for Helia for better API interoperability:
# https://github.com/ipfs/helia-http-gateway
services:
  ipfs-host-main:
    build: ./ipfs
    hostname: ipfs-host-main
    secrets:
      - swarm-key
    environment:
      IPFS_SWARM_KEY_FILE: /run/secrets/swarm-key
    # ports:
    #   - 5001:5001
  ipfs-host-2:
    build: ./ipfs
    hostname: ipfs-host-2
    secrets:
      - swarm-key
    environment:
      IPFS_SWARM_KEY_FILE: /run/secrets/swarm-key
  ipfs-host-3:
    build: ./ipfs
    hostname: ipfs-host-3
    secrets:
      - swarm-key
    environment:
      IPFS_SWARM_KEY_FILE: /run/secrets/swarm-key
  app:
    build: 
      context: ./js-etherium
      dockerfile: ./js-etherium/Dockerfile
    image: js-etherium-node
    hostname: app
  # alpine:
  #   image: alpine:3.21.2
  #   hostname: curl-host
secrets:
  swarm-key:
    file: ./ipfs/swarm.key
